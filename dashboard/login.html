<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeLink - Login</title>
</head>

<body>

    <header>
        <h1>LifeLink</h1>
        <p>A Web-Based Blood Donation and Donor Connection System</p>



        <hr>
    </header>

    <main>
        <section id="login">
            <h2>Login to LifeLink</h2>

            <p>
                Welcome back! Please enter your login information.
            </p>

            <form action="donor-dashboard.html" method="get">

                <label for="email">Email Address:</label>
                <br>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <br><br>

                <label for="password">Password:</label>
                <br>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <br><br>

                <button type="submit">Login</button>

            </form>

            <p>
                <a href="forgot-password.html">Forgot Password?</a>
            </p>

            <p>
                Don't have an account?
                <a href="registration.html">Register as a Donor</a>
            </p>

            <p>
                <a href="homepage.html">Back to Home</a>
            </p>
        </section>
    </main>

    <hr>


</body>
</html>
