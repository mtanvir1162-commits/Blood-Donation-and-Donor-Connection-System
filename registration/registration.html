<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeLink - Donor Registration</title>
</head>

<body>


    <header>
        <h1>LifeLink</h1>
        <h2>Please fill in the following information to register as a donor</h2>

        <nav align="right">
            <a href="homepage.html">Home</a> |
            <a href="login.html">Login</a>
        </nav>

        <hr>
    </header>


    <main>
        <form action="#" method="post">

            <table cellpadding="10">

                <tr>
                    <td>
                        <label for="fullname">Full Name</label>
                        <br>
                        <input type="text" id="fullname"
                            name="fullname" placeholder="Enter full name" required>
                    </td>

                    <td>
                        <label for="username">User Name</label>
                        <br>
                        <input type="text" id="username"
                            name="username" placeholder="Enter username" required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="email">Email Address</label>
                        <br>
                        <input type="email" id="email"
                            name="email" placeholder="Enter email" required>
                    </td>

                    <td>
                        <label for="mobile">Mobile Number</label>
                        <br>
                        <input type="tel" id="mobile"
                            name="mobile" placeholder="01XXXXXXXXX"
                            pattern="01[3-9][0-9]{8}"
                            title="Enter a valid 11-digit Bangladesh mobile number"
                            required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="district">District</label>
                        <br>
                        <input type="text" id="district"
                            name="district" placeholder="Enter district" required>
                    </td>

                    <td>
                        <label for="area">Area</label>
                        <br>
                        <input type="text" id="area"
                            name="area" placeholder="Enter area" required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="bloodgroup">Blood Group</label>
                        <br>
                        <select id="bloodgroup" name="bloodgroup" required>
                            <option value="">-- Select Blood Group --</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </td>

                    <td>
                        <label for="last_donation">Last Donation Date</label>
                        <br>
                        <input type="date" id="last_donation"
                            name="last_donation">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="password">Password</label>
                        <br>
                        <input type="password" id="password"
                            name="password" minlength="8"
                            placeholder="At least 8 characters" required>
                    </td>

                    <td>
                        <label for="retype">Confirm Password</label>
                        <br>
                        <input type="password" id="retype"
                            name="confirm_password" minlength="8"
                            placeholder="Re-enter password" required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <button type="submit">Register</button>
                    </td>

                    <td>
                        <button type="reset">Reset</button>
                    </td>
                </tr>

            </table>

        </form>
    </main>

    <hr>


</body>
</html>
